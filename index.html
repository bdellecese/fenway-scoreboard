<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fenway Scoreboard</title>

    <link rel="stylesheet" href="css/fenway.css">
</head>

<body>

    <div class="scoreboard">

        <header>
            <div id="score-date"></div>
        </header>

        <main>
            <!-- Featured Games -->
            <section class="featured-games">
                <div id="featured-left"></div>        
                <div id="featured-right"></div>
            </section>
            
            <!-- Out of Town Scoreboard -->
            <section id="games"></section>
        </main>
        

    </div>
    
    <script src="js/config.js"></script>
    <script src="js/teams.js"></script>
    <script src="js/scoreboard.js"></script>
    <script src="js/featured-game.js"></script>

</body>

</html>
