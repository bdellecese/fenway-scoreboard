<!DOCTYPE html>
<html>
<head>
    <title>Fenway Scoreboard</title>
    <link rel="stylesheet" href="css/fenway.css">
</head>

<body>

<div class="scoreboard">

    <div class="header">
        MAJOR LEAGUE BASEBALL
    </div>

    <div class="subheader">
        YESTERDAY'S FINAL SCORES
    </div>

    <div class="date">
        AUGUST 1, 2026
    </div>

    <div class="divider"></div>

    <div class="columns">
    
        <div class="league">
            <h2>AMERICAN LEAGUE</h2>
            <div id="american-league"></div>
        </div>
    
        <div class="league">
            <h2>NATIONAL LEAGUE</h2>
            <div id="national-league"></div>
        </div>
    </div>

</div>

<script src="js/scoreboard.js"></script>

</body>
</html>
